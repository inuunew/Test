<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail Proyek | InuuTyzDev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div id="loading-layar" aria-hidden="true">
  <i class="fas fa-robot"></i>
  <div class="dots"><span></span><span></span><span></span></div>
  <b>Memuat halaman…</b>
</div>
<header class="nav">
  <div class="wrap nav-in">
    <a href="index.html" class="brand transisi-ai"><span class="brand-dot"><i class="fas fa-bolt"></i></span>Developer Modal Ai</a>
    <nav class="nav-links" aria-label="Menu utama">
      <a href="index.html" class="transisi-ai">Beranda</a><a href="tentang.html" class="transisi-ai">Tentang</a><a href="proyek.html" class="transisi-ai" aria-current="page">Proyek</a><a href="blog.html" class="transisi-ai">Blog</a>
    </nav>
    <div class="nav-actions">
      <a href="kontak.html" class="btn btn-coral nav-cta transisi-ai" style="padding:.8rem 1.3rem">Hubungi Saya</a>
      <button class="icon-btn" id="themeToggleBtn" aria-label="Ganti tema terang/gelap"><i id="themeIcon" class="fas fa-moon"></i></button>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu" aria-expanded="false"><i class="fas fa-bars"></i></button>
    </div>
  </div>
</header>
<main class="section" style="flex:1">
  <div class="wrap" id="root-detail"><p class="muted">Memuat proyek…</p></div>
  <div class="center" style="margin-top:4rem"><a href="proyek.html" class="btn btn-primary transisi-ai"><i class="fas fa-arrow-left"></i>Kembali ke Semua Proyek</a></div>
</main>
<footer class="footer">
  <div class="wrap footer-in">
    <span>&copy; <span id="y"></span> InuuTyzDev</span>
    <span style="display:flex;gap:1.5rem;flex-wrap:wrap"><a href="tentang.html" class="transisi-ai">Tentang</a><a href="proyek.html" class="transisi-ai">Proyek</a><a href="blog.html" class="transisi-ai">Blog</a><a href="kontak.html" class="transisi-ai">Kontak</a></span>
  </div>
</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
<script src="assets/site.js"></script>
<script src="database-proyek.js"></script>
<script>
const idProyek = new URLSearchParams(window.location.search).get('id');
const proyek = databaseProyek.find(p => p.id === idProyek);
const root = document.getElementById('root-detail');
if (proyek) {
  root.innerHTML = `
    <div class="rise" style="display:flex;flex-direction:column;gap:1.2rem;max-width:820px;margin-bottom:3rem">
      <span class="chip lemon" style="align-self:flex-start">${proyek.layanan}</span>
      <h1 style="font-size:var(--fs-h1)">${proyek.nama}</h1>
    </div>
    <div class="card rise" style="--d:.1s;box-shadow:var(--shadow-lg);border-radius:28px;margin-bottom:3rem">
      <div style="display:flex;gap:.5rem;padding:.9rem 1.2rem;background:var(--card);border-bottom:2px solid var(--line)"><i style="width:.9rem;height:.9rem;border-radius:50%;background:#ff6b6b;border:2px solid var(--line)"></i><i style="width:.9rem;height:.9rem;border-radius:50%;background:#ffd84d;border:2px solid var(--line)"></i><i style="width:.9rem;height:.9rem;border-radius:50%;background:#3ddbb0;border:2px solid var(--line)"></i></div>
      <div class="card-banner" style="background-color:${proyek.warna};min-height:clamp(220px,36vw,380px);border-bottom:0;font-size:clamp(2rem,5vw,3.5rem)">${proyek.nama}</div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start">
      <section style="display:flex;flex-direction:column;gap:1.2rem">
        <h2 style="font-size:var(--fs-h3)">Tentang proyek</h2>
        <p class="lead">${proyek.deskripsi}</p>
        <div><a href="${proyek.linkPreview}" target="_blank" rel="noopener" class="btn btn-primary"><i class="fas fa-external-link-alt"></i>Buka Aplikasi Web</a></div>
      </section>
      <div style="display:flex;flex-direction:column;gap:2rem">
        <div class="card"><div class="card-body" style="gap:1.2rem">
          <div><div class="small muted" style="font-weight:700">Klien</div><div style="font-weight:700;font-size:1.2rem">${proyek.klien}</div></div>
          <div><div class="small muted" style="font-weight:700">Tanggal</div><div style="font-weight:700;font-size:1.2rem">${proyek.tanggal}</div></div>
          <div><div class="small muted" style="font-weight:700">Layanan</div><div style="font-weight:700;font-size:1.2rem">${proyek.layanan}</div></div>
        </div></div>
        <section><h2 style="font-size:var(--fs-h3);margin-bottom:1rem">Fitur utama</h2>
          <div style="display:flex;flex-wrap:wrap;gap:.7rem">${proyek.fitur.map((f, i) => `<span class="chip ${['lemon','mint','coral'][i % 3]}" style="font-size:1rem;padding:.7rem 1.1rem">${f}</span>`).join('')}</div>
        </section>
      </div>
    </div>`;
  document.title = `${proyek.nama} | InuuTyzDev`;
} else {
  root.innerHTML = '<h1 style="font-size:var(--fs-h2)">Proyek tidak ditemukan.</h1><p class="lead" style="margin-top:1rem">Periksa tautannya, atau pilih proyek dari halaman proyek.</p>';
}
</script>
</body>
</html>
