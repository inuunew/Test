<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOFLIX - Stream App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.no-scrollbar::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-[#0a0a0a] text-white font-sans pb-24">
    <nav class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-md px-4 py-3 flex justify-between items-center border-b border-white/5">
        <span class="text-xl font-black text-red-600 tracking-wider">VELO<span class="text-white">FLIX</span></span>
        <input type="text" id="search-input" placeholder="Cari film..." class="bg-gray-900 border border-white/10 text-xs px-3 py-1.5 rounded-full text-white focus:outline-none focus:border-red-600">
    </nav>
    <main id="app" class="px-4 pt-24 space-y-8">
        <div class="text-center text-gray-500 py-10 animate-pulse">Memuat database film...</div>
    </main>

    <script>
        async function loadFeed() {
            try {
                const res = await fetch('/api/feed');
                const data = await res.json();
                if(data.status === 200) {
                    renderCategories(data.kategori_beranda);
                }
            } catch(e) {
                document.getElementById('app').innerHTML = '<div class="text-center text-red-500">Gagal memuat API Vercel.</div>';
            }
        }

        function renderCategories(categories) {
            let html = '';
            categories.forEach(cat => {
                html += `
                    <section>
                        <h2 class="text-lg font-bold mb-3">${cat.nama_kategori}</h2>
                        <div class="flex overflow-x-auto no-scrollbar gap-3 pb-2">
                            ${cat.daftar_film.map(f => `
                                <div onclick="location.href='/watch?id=${f.id}&type=${f.mediaType}'" class="flex-none w-32 cursor-pointer group">
                                    <div class="h-48 rounded-2xl overflow-hidden bg-gray-900 border border-white/5">
                                        <img src="${f.posterUrl}" class="w-full h-full object-cover group-hover:scale-105 transition" loading="lazy">
                                    </div>
                                    <h3 class="text-xs font-semibold truncate mt-1.5">${f.title}</h3>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            });
            document.getElementById('app').innerHTML = html;
        }

        // Fitur Pencarian Dinamis
        const searchInput = document.getElementById('search-input');
        let timeout = null;
        searchInput.oninput = (e) => {
            clearTimeout(timeout);
            const query = e.target.value.trim();
            if(!query) { loadFeed(); return; }
            
            timeout = setTimeout(async () => {
                document.getElementById('app').innerHTML = '<div class="text-center text-gray-500 py-10">Mencari...</div>';
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if(data.results && data.results.length > 0) {
                    document.getElementById('app').innerHTML = `
                        <section>
                            <h2 class="text-lg font-bold mb-3">Hasil Pencarian: "${query}"</h2>
                            <div class="grid grid-cols-3 gap-3">
                                ${data.results.map(f => `
                                    <div onclick="location.href='/watch?id=${f.id}&type=${f.mediaType}'" class="cursor-pointer group">
                                        <div class="h-48 rounded-2xl overflow-hidden bg-gray-900 border border-white/5">
                                            <img src="${f.posterUrl}" class="w-full h-full object-cover group-hover:scale-105 transition">
                                        </div>
                                        <h3 class="text-xs font-semibold truncate mt-1.5">${f.title}</h3>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `;
                } else {
                    document.getElementById('app').innerHTML = '<div class="text-center text-gray-400 py-10">Film tidak ditemukan.</div>';
                }
            }, 500);
        };

        loadFeed();
    </script>
</body>
</html>
