<style>
  .home { width: min(560px, 100% - 2.5rem); margin: 0 auto; padding: 5rem 0 17rem; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1.25rem; }
  .avatar-wrap { position: relative; width: clamp(190px, 52vw, 240px); aspect-ratio: 1; margin-bottom: .5rem; }
  .avatar-wrap::before { content: ""; position: absolute; inset: 0; transform: translate(10px, 10px) rotate(4deg); background: var(--coral); border: 2px solid var(--line); border-radius: 38% 62% 55% 45% / 50% 45% 55% 50%; }
  .avatar { position: relative; width: 100%; height: 100%; border: 2px solid var(--line); border-radius: 38% 62% 55% 45% / 50% 45% 55% 50%; overflow: hidden; background: var(--card); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .home h1 { font-size: clamp(2.75rem, 10vw, 4rem); }
  .role { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
  .bio { max-width: 46ch; color: var(--ink-soft); font-size: 1.125rem; line-height: 1.7; }
  .links { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: .5rem; }
  .link { display: flex; align-items: center; gap: .9rem; text-align: left; padding: 1rem 1.2rem; font-weight: 700; font-size: 1.0625rem; line-height: 1.3; border-radius: 20px; grid-column: span 2; flex-direction: row; }
  .link.half { grid-column: span 1; justify-content: center; text-align: center; }
  .link .ic { width: 2.6rem; height: 2.6rem; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; border: 2px solid var(--line); background: var(--lemon); color: #14123b; font-size: 1.05rem; }
  .link:nth-child(4n+3) .ic { background: var(--mint); }
  .link:nth-child(4n+4) .ic { background: var(--coral); }
  .link .txt { flex: 1; min-width: 0; }
  .link .badge { display: inline-block; margin-top: .3rem; font-size: .8125rem; font-weight: 700; padding: .25rem .6rem; border-radius: 999px; background: var(--indigo); color: #fff; }
  .link.half.main { background: var(--indigo); color: #fff; }
  .top-actions { position: fixed; top: 1rem; right: 1rem; z-index: 1000; }

  /* Pemutar musik */
  .mp { position: fixed; z-index: 50; left: 1.25rem; bottom: 1.25rem; width: min(340px, 100% - 2.5rem); background: var(--card); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 1.1rem; display: flex; flex-direction: column; gap: .8rem; transform-origin: bottom left; transition: opacity .35s ease, transform .35s cubic-bezier(.68,-.55,.27,1.55), visibility .35s; }
  .mp.hidden { opacity: 0; visibility: hidden; transform: scale(.7) translateY(40px); }
  .mp-head { display: flex; gap: .9rem; align-items: center; }
  .mp-art { width: 3.6rem; height: 3.6rem; border-radius: 14px; object-fit: cover; border: 2px solid var(--line); flex-shrink: 0; }
  .mp-info { min-width: 0; flex: 1; }
  .mp-title { font-weight: 800; font-size: 1.0625rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-artist { font-size: var(--fs-small); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-lyrics { font-size: var(--fs-small); line-height: 1.45; font-weight: 600; background: color-mix(in srgb, var(--indigo) 10%, var(--card)); border: 2px solid var(--line); border-radius: 14px; padding: .6rem .8rem; max-height: 5.2rem; overflow-y: auto; text-align: left; white-space: pre-line; min-height: 2.8rem; }
  .lyrics-line.active { color: var(--indigo); font-weight: 700; animation: fadeIn .5s ease; }
  html.dark .lyrics-line.active { color: #a9a0ff; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .mp-row { display: flex; align-items: center; gap: .9rem; }
  .mp-play { width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 2px solid var(--line); background: var(--indigo); color: #fff; font-size: 1.1rem; cursor: pointer; box-shadow: 2px 2px 0 var(--line); flex-shrink: 0; }
  .mp-play:active { transform: translate(2px, 2px); box-shadow: none; }
  .mp-bar-wrap { flex: 1; }
  .progress-container { height: .6rem; border-radius: 999px; border: 2px solid var(--line); background: var(--card); cursor: pointer; overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: var(--coral); transition: width .1s linear; }
  .mp-time { display: flex; justify-content: space-between; font-size: .8125rem; font-weight: 700; color: var(--ink-soft); margin-top: .35rem; }
  .mp-close { position: absolute; top: -.7rem; right: -.7rem; width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 2px solid var(--line); background: var(--coral); color: #14123b; cursor: pointer; display: grid; place-items: center; }
  .mp-min { position: fixed; z-index: 50; left: 1.25rem; bottom: 1.25rem; width: 3.5rem; height: 3.5rem; border-radius: 50%; border: 2px solid var(--line); background: var(--indigo); color: #fff; font-size: 1.2rem; cursor: pointer; box-shadow: var(--shadow); opacity: 0; visibility: hidden; transform: scale(.7); transition: all .35s cubic-bezier(.68,-.55,.27,1.55); }
  .mp-min.visible { opacity: 1; visibility: visible; transform: none; }

  .bg-lyrics { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: .04; font: 800 6vw/1.2 var(--font-head); color: var(--indigo); text-align: center; }
  .bg-lyrics .background-lyric-line { position: absolute; white-space: nowrap; opacity: 0; transform: translateY(-100%); animation: lyricFlow 25s linear infinite; will-change: transform, opacity; }
  @keyframes lyricFlow { 0% { opacity: 0; transform: translateY(-100%); } 10% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(100%); } 100% { opacity: 0; transform: translateY(200%); } }

  @media (max-width: 600px) {
    .home { padding-bottom: 19rem; }
    .mp { left: 50%; right: auto; transform: translateX(-50%); transform-origin: bottom center; }
    .mp.hidden { transform: translateX(-50%) scale(.7) translateY(40px); }
    .mp-min { left: auto; right: 1.25rem; }
    .links { grid-template-columns: 1fr; }
    .link.half { grid-column: span 1; }
  }
</style>

<body>
<div id="loading-layar" aria-hidden="true"><i class="fas fa-robot"></i><div class="dots"><span></span><span></span><span></span></div><b>Memuat halaman…</b></div>

<main class="home">

<aside class="mp" id="inuutyzMusicPlayer" aria-label="Pemutar musik">

    <img src="" alt="Sampul album" class="mp-art" id="albumArt">

<script>
let inuutyzUserData = null, inuutyzCurrentLyricIndex = -1, inuutyzSongDuration = 60, inuutyzIsPlaying = false, inuutyzIsMusicPlayerVisible = true;
const $ = id => document.getElementById(id);
const inuutyzProfilePic = $('profilePic'), inuutyzProfileName = $('profileName'), inuutyzProfileBio = $('profileBio'),
  inuutyzLinksContainer = $('linksContainer'), inuutyzCurrentYear = $('currentYear'), inuutyzAlbumArt = $('albumArt'),
  inuutyzSongTitle = $('songTitle'), inuutyzArtist = $('artist'), inuutyzLyrics = $('lyrics'),
  inuutyzPlayPauseIcon = $('playPauseIcon'), inuutyzMusicPlayer = $('inuutyzMusicPlayer'), inuutyzProgressBar = $('progressBar'),
  inuutyzCurrentTimeDisplay = $('currentTime'), inuutyzTotalTimeDisplay = $('totalTime'), inuutyzAudioPlayer = $('audioPlayer'),
  inuutyzLyricsBackground = $('inuutyzLyricsBackground'), minimizedMusicPlayerIcon = $('minimizedMusicPlayerIcon'),
  themeIcon = $('themeIcon');

function setTheme(theme) {
  const dark = theme === 'dark';
  document.documentElement.classList.toggle('dark', dark);
  document.body.classList.toggle('dark', dark);
  themeIcon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
  if (inuutyzUserData) inuutyzProfilePic.src = inuutyzUserData.profile.image[dark ? 'dark' : 'light'];
  try { localStorage.setItem('theme', theme); } catch (e) {}
}
function initializeTheme() {
  let t = 'light';
  try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
  setTheme(t);
}
$('themeToggleBtn').addEventListener('click', () => setTheme(document.body.classList.contains('dark') ? 'light' : 'dark'));

const LINK_ICONS = ['fa-user', 'fa-envelope', 'fa-plug', 'fa-play', 'fa-folder-open', 'fa-store'];

function initializeFromJSON(data) {
  inuutyzUserData = data;
  inuutyzProfileName.textContent = data.profile.name;
  inuutyzProfileBio.textContent = data.profile.bio;
  let cur = 'light';
  try { cur = localStorage.getItem('theme') || 'light'; } catch (e) {}
  inuutyzProfilePic.src = data.profile.image[cur];

  inuutyzLinksContainer.innerHTML = '';
  data.links.forEach((link, index) => {
    const a = document.createElement('a');
    a.href = link.url;
    const m = link.title.match(/^(.*?)\s*\(([^)]+)\)\s*$/);   // "(Popular Project)" menjadi lencana
    const title = m ? m[1] : link.title;
    const badge = m ? m[2] : '';
    const half = index < 2;
    a.className = 'card hover link' + (half ? ' half' : '') + (index === 0 ? ' main' : '');
    if (!link.url.startsWith('http')) a.classList.add('transisi-ai');
    if (half) {
      a.textContent = title;
    } else {
      a.innerHTML = '<span class="ic"><i class="fas ' + LINK_ICONS[index] + '"></i></span><span class="txt"></span>';
      a.querySelector('.txt').textContent = title;
      if (badge) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = badge; a.querySelector('.txt').appendChild(document.createElement('br')); a.querySelector('.txt').appendChild(b); }
    }
    inuutyzLinksContainer.appendChild(a);
  });

  inuutyzSongTitle.textContent = data.music.title;
  inuutyzArtist.textContent = data.music.artist;
  inuutyzAlbumArt.src = data.music.albumArt;

  if (data.music.audioFile) {
    inuutyzAudioPlayer.src = data.music.audioFile;
    inuutyzAudioPlayer.addEventListener('loadedmetadata', () => {
      inuutyzSongDuration = inuutyzAudioPlayer.duration;
      inuutyzTotalTimeDisplay.textContent = formatTime(inuutyzSongDuration);
    });
    inuutyzAudioPlayer.addEventListener('timeupdate', () => {
      inuutyzCurrentTimeDisplay.textContent = formatTime(inuutyzAudioPlayer.currentTime);
      inuutyzProgressBar.style.width = (inuutyzAudioPlayer.currentTime / inuutyzSongDuration) * 100 + '%';
      updateLyricsDisplay(inuutyzAudioPlayer.currentTime);
      updateBackgroundLyrics(inuutyzAudioPlayer.currentTime);
    });
    inuutyzAudioPlayer.addEventListener('ended', () => {
      inuutyzAudioPlayer.currentTime = 0;
      if (inuutyzIsPlaying) inuutyzAudioPlayer.play();
      else inuutyzPlayPauseIcon.className = 'fas fa-play';
    });
  }
  if (data.music.timeSync) { updateLyricsDisplay(0); updateBackgroundLyrics(0); }
  else inuutyzLyrics.textContent = data.music.lyrics || 'No lyrics available';
  inuutyzCurrentYear.textContent = new Date().getFullYear();
}

function lyricArrayOf() {
  let a = inuutyzUserData.music.timeSync;
  if (Array.isArray(a) && a.length > 0 && Array.isArray(a[0])) a = a[0];
  return a;
}
function updateLyricsDisplay(time) {
  if (!inuutyzUserData || !inuutyzUserData.music.timeSync) return;
  const arr = lyricArrayOf();
  let cur = null, idx = -1;
  for (let i = 0; i < arr.length; i++) { if (arr[i].time <= time) { cur = arr[i]; idx = i; } else break; }
  if (cur && idx !== inuutyzCurrentLyricIndex) {
    inuutyzCurrentLyricIndex = idx;
    inuutyzLyrics.innerHTML = '';
    const line = document.createElement('div');
    line.className = 'lyrics-line active';
    line.textContent = cur.text;
    inuutyzLyrics.appendChild(line);
  }
}
function updateBackgroundLyrics(time) {
  if (!inuutyzUserData || !inuutyzUserData.music.timeSync) return;
  const arr = lyricArrayOf();
  inuutyzLyricsBackground.innerHTML = '';
  let start = -1;
  for (let i = 0; i < arr.length; i++) { if (arr[i].time > time) { start = i; break; } }
  if (start === -1 && arr.length > 0) start = arr.length - 1; else if (start === -1) return;
  for (let i = 0; i < 3; i++) {
    if (start + i < arr.length) {
      const l = document.createElement('div');
      l.className = 'background-lyric-line';
      l.textContent = arr[start + i].text;
      l.style.animationDelay = (i * 2) + 's';
      inuutyzLyricsBackground.appendChild(l);
    }
  }
}
function formatTime(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }

function togglePlayPause() {
  inuutyzIsPlaying = !inuutyzIsPlaying;
  inuutyzPlayPauseIcon.className = inuutyzIsPlaying ? 'fas fa-pause' : 'fas fa-play';
  if (inuutyzAudioPlayer.src) { inuutyzIsPlaying ? inuutyzAudioPlayer.play() : inuutyzAudioPlayer.pause(); }
}
$('playPauseBtn').addEventListener('click', e => { e.stopPropagation(); togglePlayPause(); });
document.querySelector('.progress-container').addEventListener('click', function (e) {
  if (inuutyzAudioPlayer.src) {
    const r = this.getBoundingClientRect();
    inuutyzAudioPlayer.currentTime = ((e.clientX - r.left) / r.width) * inuutyzSongDuration;
  }
});
function minimizeMusicPlayer() { inuutyzMusicPlayer.classList.add('hidden'); minimizedMusicPlayerIcon.classList.add('visible'); inuutyzIsMusicPlayerVisible = false; }
function maximizeMusicPlayer() {
  inuutyzMusicPlayer.classList.remove('hidden'); minimizedMusicPlayerIcon.classList.remove('visible'); inuutyzIsMusicPlayerVisible = true;
  if (inuutyzIsPlaying && inuutyzAudioPlayer.paused) inuutyzAudioPlayer.play();
}
$('inuutyzMusicCloseBtn').addEventListener('click', minimizeMusicPlayer);
minimizedMusicPlayerIcon.addEventListener('click', maximizeMusicPlayer);

document.addEventListener('click', function playOnFirstInteraction() {
  if (!inuutyzIsPlaying && inuutyzIsMusicPlayerVisible) togglePlayPause();
  document.removeEventListener('click', playOnFirstInteraction);
}, { once: true });

// Layar loading hanya saat pindah halaman
document.addEventListener('click', function (event) {
  const link = event.target.closest('a.transisi-ai');
  if (!link || event.ctrlKey || event.metaKey) return;
  event.preventDefault();
  const url = link.getAttribute('href');
  $('loading-layar').classList.add('on');
  setTimeout(() => { window.location.href = url; }, 600);
});
// Perbaikan: layar loading menempel saat tombol Back
window.addEventListener('pageshow', e => { if (e.persisted) $('loading-layar').classList.remove('on'); });
