<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube MP3 Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
    <h1 class="text-2xl font-bold text-center text-blue-400">YT MP3 Downloader</h1>
    
    <div class="space-y-3">
      <input 
        type="text" 
        id="ytUrl" 
        placeholder="Tempel link YouTube di sini..." 
        class="w-full px-4 py-3 bg-slate-700 rounded-xl border border-slate-600 focus:outline-none focus:border-blue-500 text-sm"
      />
      <button 
        onclick="processVideo()" 
        id="btnConvert"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition duration-200"
      >
        Konversi
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden text-center text-slate-400 text-sm">
      Memproses video, mohon tunggu...
    </div>

    <!-- Result Card -->
    <div id="result" class="hidden space-y-4 pt-4 border-t border-slate-700">
      <img id="thumb" class="w-full h-48 object-cover rounded-xl" src="" alt="Thumbnail" />
      <h2 id="videoTitle" class="font-semibold text-sm line-clamp-2"></h2>
      <p id="duration" class="text-xs text-slate-400"></p>
      
      <a 
        id="downloadBtn" 
        href="#" 
        target="_blank"
        class="block text-center w-full bg-green-600 hover:bg-green-500 text-white font-medium py-3 rounded-xl transition duration-200"
      >
        Unduh MP3
      </a>
    </div>
  </div>

  <script>
    async function processVideo() {
      const urlInput = document.getElementById('ytUrl').value;
      const btnConvert = document.getElementById('btnConvert');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');

      if (!urlInput) return alert('Masukkan link YouTube terlebih dahulu!');

      btnConvert.disabled = true;
      loading.classList.remove('hidden');
      result.classList.add('hidden');

      try {
        const response = await fetch(`/api/convert?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (data.status && data.result) {
          document.getElementById('thumb').src = data.result.thumbnail;
          document.getElementById('videoTitle').innerText = data.result.title;
          document.getElementById('duration').innerText = `Durasi: ${data.result.duration} detik`;

          const streamUrl = data.result.audio.url;
          const title = data.result.title;

          // Arahkan link download ke endpoint proxy backend
          const proxyDownloadUrl = `/api/download?url=${encodeURIComponent(streamUrl)}&title=${encodeURIComponent(title)}`;
          document.getElementById('downloadBtn').href = proxyDownloadUrl;

          result.classList.remove('hidden');
        } else {
          alert('Gagal mengambil data video. Pastikan link benar.');
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi.');
      } finally {
        btnConvert.disabled = false;
        loading.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
