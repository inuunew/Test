<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - VELOFLIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans pb-20">
    <div class="relative w-full aspect-video bg-black sticky top-0 z-50">
        <iframe id="player" class="w-full h-full absolute inset-0" allowfullscreen frameborder="0"></iframe>
    </div>
    
    <main class="px-4 py-6 max-w-2xl mx-auto space-y-6">
        <div>
            <h1 id="title" class="text-2xl font-black mb-1">Memuat judul...</h1>
            <p id="meta" class="text-xs text-gray-400"></p>
        </div>

        <div class="bg-[#161616] p-4 rounded-2xl border border-white/5">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Pilih Server Streaming (8 Tersedia)</h3>
            <div id="servers" class="flex flex-col gap-2"></div>
        </div>

        <div>
            <h3 class="text-xs font-bold text-red-600 uppercase tracking-widest mb-1">Overview</h3>
            <p id="synopsis" class="text-sm text-gray-300 leading-relaxed"></p>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const type = params.get('type') || 'movie';

        async function initWatch() {
            const res = await fetch(`/api/detail?id=${id}&type=${type}`);
            const data = await res.json();
            if(data.status === 200) {
                const d = data.detail;
                document.getElementById('title').innerText = d.judul;
                document.getElementById('meta').innerText = `${d.tahun || ''} • ${d.jenis} • ⭐ ${d.rating || 'N/A'}`;
                document.getElementById('synopsis').innerText = d.sinopsis;

                const serverContainer = document.getElementById('servers');
                const player = document.getElementById('player');
                let first = true;

                Object.entries(data.server_streaming).forEach(([name, url]) => {
                    if(first) { player.src = url; first = false; }
                    
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-3 rounded-xl bg-black/40 border border-white/5 hover:border-red-600 text-sm font-semibold flex justify-between items-center transition';
                    btn.innerHTML = `<span>${name}</span> <span class="text-[10px] text-red-500 font-bold uppercase">Ready</span>`;
                    btn.onclick = () => { player.src = url; };
                    serverContainer.appendChild(btn);
                });
            }
        }
        initWatch();
    </script>
</body>
</html>
