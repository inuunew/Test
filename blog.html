    <nav class="nav-links" aria-label="Menu utama">
      <a href="index.html" class="transisi-ai">Beranda</a><a href="tentang.html" class="transisi-ai">Tentang</a><a href="proyek.html" class="transisi-ai">Proyek</a><a href="blog.html" class="transisi-ai" aria-current="page">Blog</a>

      <a href="kontak.html" class="btn btn-coral nav-cta transisi-ai" style="padding:.8rem 1.3rem">Hubungi Saya</a>

    </div>
  </div>
</header>
<main>
<section class="section" style="padding-bottom:2rem">
  <div class="wrap rise"><h1>Semua Artikel</h1><p class="lead" style="margin-top:1rem">Tulisan seputar teknologi, tips, tutorial, dan desain web.</p></div>
</section>
<section style="padding-bottom:clamp(3.5rem,8vw,6rem)">
  <div class="wrap">
    <div class="toolbar">
      <div class="search"><i class="fas fa-search"></i><label class="sr-only" for="searchInput">Cari artikel</label><input type="text" id="searchInput" placeholder="Cari judul artikel..." class="input"></div>
      <div class="filters">
        <button class="filter-btn active" onclick="filterBlog('Semua')">Semua</button>
        <button class="filter-btn" onclick="filterBlog('Teknologi')">Teknologi</button>
        <button class="filter-btn" onclick="filterBlog('Tips')">Tips</button>
        <button class="filter-btn" onclick="filterBlog('Tutorial')">Tutorial</button>
        <button class="filter-btn" onclick="filterBlog('Desain')">Desain</button>
      </div>
    </div>
    <div id="container-blog" class="grid g2"></div>
    <p id="no-results" class="center muted" style="display:none;padding:4rem 0;font-weight:600">Artikel tidak ditemukan. Coba kata kunci lain.</p>
  </div>
</section>
</main>
<footer class="footer">
  <div class="wrap footer-in">
    <span>&copy; <span id="y"></span> InuuTyzDev</span>
    <span style="display:flex;gap:1.5rem;flex-wrap:wrap"><a href="tentang.html" class="transisi-ai">Tentang</a><a href="proyek.html" class="transisi-ai">Proyek</a><a href="blog.html" class="transisi-ai">Blog</a><a href="kontak.html" class="transisi-ai">Kontak</a></span>
  </div>
</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
<script src="assets/site.js"></script>
<script src="database-blog.js"></script>
<script>
const container = document.getElementById('container-blog');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('no-results');
let activeCat = 'Semua';

function renderBlog(data) {
  noResults.style.display = data.length ? 'none' : 'block';
  container.innerHTML = data.map(p => `
    <article class="card hover">
      <div class="card-banner" style="background-color:${p.warna};min-height:220px"><span class="tag">${p.kategori}</span><span>${p.judulBanner}</span></div>
      <div class="card-body">
        <div class="meta"><span>${p.tanggal}</span><span>${p.durasi}</span></div>
        <h3>${p.judulArtikel}</h3>
        <p class="muted clamp-3 grow">${p.deskripsi}</p>
        <a href="artikel.html?id=${p.id}" class="btn btn-block transisi-ai">Baca Selengkapnya <i class="fas fa-arrow-right"></i></a>
      </div>
    </article>`).join('');
}
function apply() {
  const val = searchInput.value.toLowerCase();
  renderBlog(databaseBlog.filter(p =>
    (activeCat === 'Semua' || p.kategori === activeCat) && p.judulArtikel.toLowerCase().includes(val)));
}
searchInput.addEventListener('input', apply);
function filterBlog(cat) {
  activeCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === cat));
  apply();
}
renderBlog(databaseBlog);
</script>
</body>
</html>
